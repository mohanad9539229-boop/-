<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLAX HUB | خيارك يساعدنا</title>
    <style>
        :root {
            --green: #00ff64;
            --red: #ff4b4b;
            --glass: rgba(10, 10, 10, 0.85);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; background: #000; color: white;
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            height: 100vh; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .video-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2; object-fit: cover; filter: brightness(0.4) contrast(1.1);
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.85) 100%);
            z-index: -1;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 40px; padding: 50px 25px;
            width: 90%; max-width: 380px; text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9);
        }

        h1 { font-size: 2rem; font-weight: 900; margin: 0 0 10px 0; letter-spacing: -1px; }
        p { color: #aaa; font-size: 1rem; margin-bottom: 35px; line-height: 1.6; }

        .btn {
            display: flex; align-items: center; justify-content: center;
            width: 100%; padding: 20px; border-radius: 22px;
            font-size: 1.1rem; font-weight: 800; text-decoration: none;
            margin-bottom: 15px; transition: 0.3s;
            border: none;
        }

        .btn-support {
            background: linear-gradient(135deg, #008f39, var(--green));
            color: white;
            box-shadow: 0 10px 25px rgba(0, 255, 100, 0.3);
        }

        .btn-skip {
            background: rgba(255, 255, 255, 0.05);
            color: var(--red);
            border: 1px solid rgba(255, 75, 75, 0.2);
            font-size: 0.95rem;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-skip.ready {
            opacity: 1;
            cursor: pointer;
            border-color: var(--red);
            background: rgba(255, 75, 75, 0.1);
        }

        .btn:active { transform: scale(0.96); }

        .footer { margin-top: 30px; font-size: 0.75rem; color: #555; font-weight: bold; }
    </style>
</head>
<body>

    <video class="video-bg" autoplay loop playsinline muted>
        <source src="https://www.image2url.com/r2/default/videos/1778593303131-2a30aeb1-2f6c-4a14-a6ce-51b0b956b8b9.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="card">
        <h1>خيارك يساعدنا 🗡️</h1>
        <p>دعمك البسيط يضمن لنا الاستمرار في تطوير وتحديث <b>SLAX HUB</b></p>

        <a href="https://linkvertise.com/5718920/Kmr1IoPzl31k?o=sharing" class="btn btn-support">
            ادعمكم ❤️ ✨ ⭐
        </a>

        <a id="skipBtn" href="#" class="btn btn-skip" onclick="return false;">
            ما ادعمكم 💔 (<span id="count">5</span>)
        </a>

        <div class="footer">SLAX COMMUNITY © 2026</div>
    </div>

    <script>
        let timeLeft = 5;
        const skipBtn = document.getElementById('skipBtn');
        const count = document.getElementById('count');

        const timer = setInterval(() => {
            timeLeft--;
            count.innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                skipBtn.innerHTML = "ما ادعمكم 💔";
                skipBtn.classList.add('ready');
                skipBtn.onclick = function() { 
                    window.location.href = "https://aimbot-dead-rails.vercel.app"; 
                };
            }
        }, 1000);
    </script>

</body>
</html>
