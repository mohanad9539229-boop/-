<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLAX Support | اختيارك يفرق</title>
    <style>
        :root {
            --green: #00ff64;
            --red: #ff4b4b;
            --glass: rgba(20, 20, 20, 0.85);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; background: #050505; color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 40px; padding: 45px 25px;
            width: 90%; max-width: 380px; text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
        }

        h1 { font-size: 1.6rem; margin-bottom: 15px; font-weight: 800; }
        p { color: #aaa; font-size: 0.95rem; margin-bottom: 35px; line-height: 1.6; }

        .btn {
            display: flex; align-items: center; justify-content: center;
            width: 100%; padding: 20px; border-radius: 20px;
            font-size: 1.1rem; font-weight: 800; text-decoration: none;
            margin-bottom: 15px; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none; cursor: pointer;
        }

        /* زر الدعم (Linkvertise) */
        .btn-support {
            background: linear-gradient(135deg, #008f39, var(--green));
            color: white;
            box-shadow: 0 10px 25px rgba(0, 255, 100, 0.3);
        }

        /* زر التحميل المباشر (مع العداد) */
        .btn-direct {
            background: rgba(255, 75, 75, 0.05);
            color: var(--red);
            border: 1px solid rgba(255, 75, 75, 0.2);
            font-size: 0.9rem;
            cursor: not-allowed; /* شكل الماوس يكون ممنوع */
            opacity: 0.5;
        }

        /* حالة الزر بعد انتهاء العداد */
        .btn-direct.ready {
            background: rgba(255, 75, 75, 0.15);
            opacity: 1;
            cursor: pointer;
            border-color: rgba(255, 75, 75, 0.5);
        }

        .btn:active { transform: scale(0.96); }

        .footer { margin-top: 25px; font-size: 0.7rem; color: #444; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h1>خيارك يحدد سرعة التحديث 🗡️</h1>
        <p>هل تود دعمنا بمشاهدة إعلان بسيط للاستمرار في تطوير سكريبتات <b>SLAX</b>؟</p>

        <a href="https://linkvertise.com/5718920/Kmr1IoPzl31k?o=sharing" class="btn btn-support">
            ادعمكم ❤️ ✨ ⭐
        </a>

        <a id="directBtn" href="#" class="btn btn-direct" onclick="return false;">
            ما ادعمكم 💔 (<span id="timer">5</span>)
        </a>

        <div class="footer">SLAX COMMUNITY © 2026</div>
    </div>

    <script>
        let timeLeft = 5;
        const timerElement = document.getElementById('timer');
        const directBtn = document.getElementById('directBtn');

        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                directBtn.innerHTML = "ما ادعمكم 💔"; // تغيير النص عند الانتهاء
                directBtn.classList.add('ready'); // تفعيل الشكل الجاهز
                directBtn.onclick = function() { 
                    window.location.href = "https://aimbot-dead-rails.vercel.app"; 
                };
            }
        }, 1000);
    </script>

</body>
</html>
